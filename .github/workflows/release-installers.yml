name: Release installers (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [stage-release-installers]

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  macos:
    name: macOS universal PKG
    # arm64 hosted runners repeatedly failed acquisition under GitHub capacity constraints.
    # Intel can build both slices and execute the x86_64 gate; arm64 AU remains explicit.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version
        run: |
          version="$(sed -n 's/^project(Sonicator VERSION \([0-9][0-9.]*\) .*/\1/p' CMakeLists.txt)"
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/onnxruntime-*.nupkg
          key: macos-installer-deps-v2-${{ hashFiles('CMakeLists.txt', 'cmake/RubberBand.cmake') }}
      - name: Packaging behavior tests
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Build universal payloads
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DBUILD_TESTING=OFF \
            -DSONICATOR_BUILD_PLUGIN=ON
          cmake --build build --target Sonicator SonicatorPlugin_VST3 SonicatorPlugin_AU -j 4
      - name: Package and collect matching sources
        run: |
          sh packaging/macos/build-pkg.sh build dist
          sh packaging/tests/test-macos-pkg.sh "dist/SONICATOR-$VERSION-macOS-universal.pkg"
          python3 packaging/make-source-bundle.py build dist
          git rev-parse HEAD > dist/source-commit.txt
          cd dist
          shasum -a 256 -c "SONICATOR-$VERSION-macOS-universal.pkg.sha256"
          shasum -a 256 -c "SONICATOR-$VERSION-sources.tar.gz.sha256"
          cd ..
      - name: Download pinned pluginval
        run: |
          curl -fL "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip" -o "$RUNNER_TEMP/pluginval.zip"
          ditto -xk "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"
      - name: Install, inspect, validate and reinstall on disposable runner
        run: |
          set -e
          mkdir -p validation
          PKG="$PWD/dist/SONICATOR-$VERSION-macOS-universal.pkg"
          sudo installer -pkg "$PKG" -target / -dumplog
          # A runtime hidden in the build tree cannot rescue a broken installed bundle.
          ONNX_LIB="$(ls -d build/onnxruntime-*-src/lib)"
          mv "$ONNX_LIB" "$ONNX_LIB-unavailable"
          trap 'mv "$ONNX_LIB-unavailable" "$ONNX_LIB"' EXIT
          APP=/Applications/SONICATOR.app
          VST3=/Library/Audio/Plug-Ins/VST3/SONICATOR.vst3
          AU=/Library/Audio/Plug-Ins/Components/SONICATOR.component
          for bundle in "$APP" "$VST3" "$AU"; do
            sh packaging/macos/verify-bundle.sh "$bundle"
            if xattr -r "$bundle" | grep -q com.apple.quarantine; then exit 1; fi
          done
          # Seed a fresh disposable profile with sharing OFF, so startup is not blocked by the
          # first-launch consent alert. The alert itself is separate manual acceptance.
          test ! -e "$HOME/Library/Sonicator/settings.json"
          mkdir -p "$HOME/Library/Sonicator"
          CONSENT="$(sed -n 's/.*currentContributionConsentVersion *= *\([0-9][0-9]*\).*/\1/p' core/settings/AppSettings.h)"
          test -n "$CONSENT"
          printf '{"contributionConsentVersion": %s, "contributeTrainingData": false}\n' "$CONSENT" \
            > "$HOME/Library/Sonicator/settings.json"
          if ! open -n "$APP"; then
            echo 'LaunchServices open failed; launching the binary directly'
            "$APP/Contents/MacOS/SONICATOR" > validation/app.log 2>&1 &
          fi
          APP_PID=''
          for attempt in $(seq 1 30); do
            APP_PID="$(pgrep -f "$APP/Contents/MacOS/SONICATOR" | head -1 || true)"
            test -n "$APP_PID" && break
            sleep 1
          done
          test -n "$APP_PID" || { echo 'installed application did not start'; exit 1; }
          sleep 3
          kill -0 "$APP_PID"
          osascript -e 'tell application id "com.sonicator.browser" to quit' \
            || echo 'Apple Event quit returned an error; checking the process instead'
          for attempt in $(seq 1 30); do
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo 'installed application did not quit'
            kill -9 "$APP_PID" || true
            exit 1
          fi
          # Test real catalog/settings plus synthetic exported media remain unchanged.
          mkdir -p "$HOME/Library/Sonicator/exports"
          printf 'installer media sentinel' > "$HOME/Library/Sonicator/exports/installer-test.wav"
          shasum -a 256 "$HOME/Library/Sonicator/sonicator.sqlite" \
            "$HOME/Library/Sonicator/settings.json" \
            "$HOME/Library/Sonicator/exports/installer-test.wav" > validation/user-data.sha256
          PV="$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"
          "$PV" --strictness-level 10 --skip-gui-tests --output-dir validation --validate "$VST3"
          "$PV" --strictness-level 10 --skip-gui-tests --output-dir validation --validate "$AU"
          NATIVE_ARCH="$(uname -m)"
          auval -v aumu Sncr Orng -strict > "validation/auval-$NATIVE_ARCH.log" 2>&1
          if test "$NATIVE_ARCH" = arm64; then
            arch -x86_64 auval -v aumu Sncr Orng -strict > validation/auval-x86_64.log 2>&1
          else
            echo 'arm64 AU execution is pending on an Apple Silicon machine; not proven by this Intel runner.' > validation/arm64-au-pending.txt
          fi
          sudo installer -pkg "$PKG" -target / -dumplog
          shasum -a 256 -c validation/user-data.sha256
      - name: Installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SONICATOR-macOS-universal
          path: dist/
      - name: Validation logs
        if: always()
        # Diagnostics only: a transient artifact-service outage must not turn a validated
        # product into a red run. Installer artifacts above stay required.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-macOS
          path: validation/
          if-no-files-found: ignore

  windows:
    name: Windows x64 MSI
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version and upgrade fixture
        run: |
          $Version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Sonicator VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not $Version) { throw 'Cannot read the project version' }
          $Parts = $Version.Split('.')
          $Fixture = "$($Parts[0]).$($Parts[1]).$([int]$Parts[2] + 1)"
          "VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FIXTURE=$Fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $Version, upgrade fixture $Fixture"
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/onnxruntime-*.nupkg
          key: windows-installer-deps-${{ hashFiles('CMakeLists.txt', 'cmake/RubberBand.cmake') }}
      - name: Packaging behavior tests
        run: |
          python -m unittest discover -s packaging/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/tests/test-crt.ps1
      - name: Configure and build Release app and VST3
        run: |
          $System = Get-CimInstance Win32_ComputerSystem
          $CompilerJobs = if ($System.TotalPhysicalMemory -ge 12GB) { 4 } else { 2 }
          Write-Host "Memory $($System.TotalPhysicalMemory) bytes; compiler workers $CompilerJobs"
          cmake --preset release-windows-installer -DBUILD_TESTING=ON "-DSONICATOR_MSVC_COMPILER_JOBS=$CompilerJobs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset release-windows-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and collect matching sources
        run: |
          ./packaging/windows/build-msi.ps1 -BuildDir build -OutputDir dist
          python packaging/make-source-bundle.py build dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Out-File -Encoding utf8 dist/source-commit.txt
          foreach ($Sum in Get-ChildItem dist/*.sha256) {
            $Parts = (Get-Content $Sum.FullName -Raw).Trim() -split '\s+'
            $Actual = (Get-FileHash (Join-Path dist $Parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Actual -ne $Parts[0]) { throw "Checksum mismatch: $($Parts[1])" }
          }
          ./packaging/windows/build-msi.ps1 -BuildDir build -OutputDir "$env:RUNNER_TEMP/upgrade" -VersionOverride $env:FIXTURE
      - name: Download pinned pluginval
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile "$env:RUNNER_TEMP/pluginval.zip"
          Expand-Archive "$env:RUNNER_TEMP/pluginval.zip" "$env:RUNNER_TEMP/pluginval"
      - name: Installed application, VST3 and MSI lifecycle tests
        run: |
          $Pluginval = (Get-ChildItem "$env:RUNNER_TEMP/pluginval" -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          ./packaging/windows/test-install.ps1 -Msi "dist/SONICATOR-$env:VERSION-Windows-x64.msi" `
            -UpgradeMsi "$env:RUNNER_TEMP/upgrade/SONICATOR-$env:FIXTURE-Windows-x64.msi" `
            -Pluginval $Pluginval -LogDir validation
      - name: Build full test suite
        run: |
          cmake --build build --config Release --target SonicatorTests -j 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ONNX runtime loading positive and negative controls
        run: |
          $Tests = (Resolve-Path build/tests/Release/SonicatorTests.exe).Path
          $Runtime = Join-Path (Split-Path $Tests) onnxruntime.dll
          New-Item -ItemType Directory -Force validation | Out-Null
          # Wildcards: a literal test name contains a comma, which Catch2 would split into
          # several specs and match nothing (a vacuous negative control).
          $Filter = '*OnnxAudioClassifier*'
          Push-Location $env:RUNNER_TEMP
          try {
            Move-Item $Runtime "$Runtime.disabled"
            try {
              & $Tests $Filter *> (Join-Path $env:GITHUB_WORKSPACE 'validation/onnx-without-runtime.log')
              $Negative = $LASTEXITCODE
            } finally { Move-Item "$Runtime.disabled" $Runtime }
            & $Tests $Filter *> (Join-Path $env:GITHUB_WORKSPACE 'validation/onnx-with-runtime.log')
            $Positive = $LASTEXITCODE
          } finally { Pop-Location }
          $NegativeText = Get-Content validation/onnx-without-runtime.log -Raw
          $PositiveText = Get-Content validation/onnx-with-runtime.log -Raw
          Write-Host "negative exit $Negative, positive exit $Positive"
          if ($Negative -eq 0 -or $NegativeText.Contains('All tests passed')) {
            throw 'ONNX test unexpectedly passed without its bundled runtime'
          }
          if ($Positive -ne 0 -or -not $PositiveText.Contains('All tests passed')) {
            throw 'Bundled ONNX runtime positive control failed'
          }
      - name: Full Windows suite
        run: |
          & build/tests/Release/SonicatorTests.exe --reporter compact *> validation/full-suite.log
          if ($LASTEXITCODE -ne 0) { Get-Content validation/full-suite.log -Tail 60; exit $LASTEXITCODE }
      - name: Installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SONICATOR-Windows-x64
          path: dist/
      - name: Validation logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-Windows
          path: validation/
          if-no-files-found: ignore

  # The container is the release baseline, not a convenience: an AppImage carries no glibc, so a
  # package built on a newer distribution would lock every user to that distribution.
  linux:
    name: Linux x86_64 (AppImage + deb)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates curl python3 file desktop-file-utils \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libxrender-dev libxi-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl-dev xvfb
      - uses: actions/checkout@v4
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/onnxruntime-*.nupkg
          key: linux-installer-deps-${{ hashFiles('CMakeLists.txt', 'cmake/RubberBand.cmake') }}
      - name: Packaging behavior tests
        run: sh packaging/tests/test-linux-package.sh
      - name: Configure and build Release
        run: |
          cmake --preset ci-linux
          cmake --build --preset ci-linux
      # About twenty test files open real windows, so the suite needs a display. A container's
      # /dev/shm is 64 MB, and the shared-memory image path runs out of it mid-suite with
      # "X Error: BadAccess (MIT-SHM)"; without the extension JUCE draws through XPutImage.
      - name: Test under Xvfb
        run: xvfb-run --auto-servernum -s "-extension MIT-SHM" ctest --preset ci-linux
      - name: Package and collect matching sources
        run: |
          # The container checks the tree out under a different owner, and the matching-source
          # archive is built with git archive from this directory.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh packaging/linux/build-packages.sh build dist
          python3 packaging/make-source-bundle.py build dist
          git rev-parse HEAD > dist/source-commit.txt
          cd dist && for sum in *.sha256; do sha256sum -c "$sum"; done && ls -l
      # A package that installs but cannot find its own runtime is not a deliverable, and the
      # dependency list is the only thing that makes apt install the right libraries.
      - name: Verify the artifacts
        run: |
          set -e
          deb="$(ls dist/*.deb)"
          depends="$(dpkg-deb -f "$deb" Depends)"
          echo "Depends: $depends"
          echo "$depends" | grep -q libasound2
          echo "$depends" | grep -q 'libc6 (>= 2.35)'
          # JUCE links these directly; a package that omits them installs and then fails to start
          # on a minimal desktop.
          for library in libfontconfig1 libxrender1 libxi6 libxrandr2 libxcursor1; do
            echo "$depends" | grep -q "$library"
          done
          listing="$(dpkg-deb -c "$deb")"
          echo "$listing" | grep -q 'usr/bin/SONICATOR'
          echo "$listing" | grep -q 'usr/lib/sonicator/libonnxruntime.so.1'
          echo "$listing" | grep -q 'usr/share/applications/sonicator.desktop'
          appimage="$(ls dist/*.AppImage)"
          test -x "$appimage"
          echo "AppImage: $(basename "$appimage") ($(wc -c < "$appimage") bytes)"
      - name: Installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SONICATOR-Linux-x86_64
          path: dist/
