name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.config }}
    # macos-15 is the arm64 image this project is developed on. macos-14 is retired on GitHub-hosted
    # runners: its jobs are cancelled before they start, so it must not be used.
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: ci-macos-debug
          - config: Release
            preset: ci-macos-release
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version || brew install ninja

      # The checkout lives in an iCloud-synchronised folder on the development machine, which
      # occasionally creates "name 2.ext" conflict copies. They are never wanted in the tree.
      - name: Reject iCloud conflict copies
        run: |
          if git ls-files | grep -E ' [0-9]+\.[A-Za-z0-9]+$'; then
            echo "::error::conflict copies are tracked; remove them from the repository"
            exit 1
          fi

      # FetchContent sources dominate the first configure. The cache key follows the files that pin
      # those versions, so a dependency bump re-downloads once instead of on every run.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/onnxruntime-*.nupkg
          key: ${{ runner.os }}-${{ matrix.config }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.config }}-deps-
            ${{ runner.os }}-deps-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-macos-${{ matrix.config }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

  # The plugin is a separate artifact from the application: it is built universal in Release, both
  # wrappers are checked for their embedded runtime and signature, and the AU must pass auval.
  macos-plugin:
    name: macOS plugin (universal)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version || brew install ninja

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-plugin-deps-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-plugin-deps-
            ${{ runner.os }}-deps-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DBUILD_TESTING=OFF \
            -DSONICATOR_BUILD_PLUGIN=ON

      # The smoke target uses the same processor and editor without a DAW host, so a build that
      # cannot open its window fails here and not in the owner's session.
      - name: Build VST3, AU and the smoke target
        run: |
          cmake --build build --target SonicatorPlugin_VST3 SonicatorPlugin_AU \
            SonicatorPluginSmoke -j 6

      - name: Verify bundles, runtime and identifiers
        run: |
          set -e
          VST3=build/plugin/SonicatorPlugin_artefacts/Release/VST3/SONICATOR.vst3
          AU=build/plugin/SonicatorPlugin_artefacts/Release/AU/SONICATOR.component
          # Both formats, both architectures, and the same for the embedded runtime: a plugin that
          # only runs on the machine that built it is not a deliverable.
          for binary in "$VST3/Contents/MacOS/SONICATOR" "$AU/Contents/MacOS/SONICATOR" \
                        "$VST3/Contents/Frameworks/libonnxruntime.dylib" \
                        "$AU/Contents/Frameworks/libonnxruntime.dylib"; do
            test -f "$binary"
            lipo -archs "$binary" | grep -q arm64
            lipo -archs "$binary" | grep -q x86_64
          done
          # The runtime is found relative to the bundle, and nothing points into the build tree.
          for binary in "$VST3/Contents/MacOS/SONICATOR" "$AU/Contents/MacOS/SONICATOR"; do
            otool -L "$binary" | grep -q "@rpath/libonnxruntime.dylib"
            if otool -L "$binary" | grep -E "$PWD|/Users/runner|/Users/admin|Library/Caches"; then
              echo "::error::$binary links against a build-tree path"
              exit 1
            fi
          done
          # Manifest and AU properties name the product, its vendor and its codes.
          test -f "$VST3/Contents/Resources/moduleinfo.json"
          grep -q '"Name": "SONICATOR"' "$VST3/Contents/Resources/moduleinfo.json"
          grep -q 'ABCDEF019182FAEB4F726E67536E6372' "$VST3/Contents/Resources/moduleinfo.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$AU/Contents/Info.plist")" = "com.sonicator.plugin"
          AU_INFO="$(/usr/libexec/PlistBuddy -c 'Print :AudioComponents:0' "$AU/Contents/Info.plist")"
          echo "$AU_INFO" | grep -q 'type = aumu'
          echo "$AU_INFO" | grep -q 'subtype = Sncr'
          echo "$AU_INFO" | grep -q 'manufacturer = Orng'
          codesign --verify --deep --strict "$VST3"
          codesign --verify --deep --strict "$AU"
          lipo -archs "build/plugin/SonicatorPluginSmoke_artefacts/Release/SONICATOR Plugin Smoke.app/Contents/MacOS/SONICATOR Plugin Smoke" | grep -q arm64

      - name: AU validation
        run: |
          set -e
          AU=build/plugin/SonicatorPlugin_artefacts/Release/AU/SONICATOR.component
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/SONICATOR.component"
          cp -R "$AU" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Sncr Orng

  # Windows runs the whole suite and gates the branch, like the macOS jobs. The state the port
  # reached is recorded in docs/WINDOWS_PORT.md.
  windows:
    name: Windows Debug
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: cmake --version

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows

      - name: Test
        run: ctest --preset ci-windows

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

  # Linux runs in the release baseline container: an AppImage carries no glibc, so the build host's
  # glibc is the runtime floor for every user, and 22.04 keeps it at 2.35. The state this job reached
  # while the port was being established is recorded in docs/LINUX_PORT.md.
  linux:
    name: Linux Release
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libxrender-dev libxi-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl-dev \
            xvfb

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++ --version | head -1

      # FetchContent sources dominate the first configure. The key follows the files that pin those
      # versions, so a dependency bump re-downloads once instead of on every run.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'CMakePresets.json', 'cmake/RubberBand.cmake') }}
          restore-keys: |
            linux-deps-

      - name: Configure
        run: cmake --preset ci-linux

      - name: Packaging behavior tests
        run: sh packaging/tests/test-linux-package.sh

      - name: Build
        # Keep going past the first failing target: a port surfaces several unrelated errors per
        # round otherwise, and every round costs a full CI cycle.
        run: cmake --build --preset ci-linux -- -k 0

      # About twenty test files open real windows, so the suite needs a display. A container's
      # /dev/shm is 64 MB, and the shared-memory image path runs out of it mid-suite with
      # "X Error: BadAccess (MIT-SHM)"; without the extension JUCE draws through XPutImage.
      - name: Test under Xvfb
        run: xvfb-run --auto-servernum -s "-extension MIT-SHM" ctest --preset ci-linux

      # A binary that links but cannot open its window is not a port. The application must resolve
      # every library and survive its first launch, which also creates and migrates the catalog.
      - name: Start the application headless
        run: |
          set -e
          if ldd build/Sonicator_artefacts/Release/SONICATOR | grep "not found"; then
            echo "::error::the application has unresolved shared libraries"
            exit 1
          fi
          xvfb-run --auto-servernum -s "-extension MIT-SHM" build/Sonicator_artefacts/Release/SONICATOR &
          pid=$!
          sleep 10
          kill -0 "$pid"
          kill "$pid" || true

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-linux
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
