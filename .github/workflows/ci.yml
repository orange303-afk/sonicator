name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.config }}
    # macos-15 is the arm64 image this project is developed on. macos-14 is retired on GitHub-hosted
    # runners: its jobs are cancelled before they start, so it must not be used.
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: ci-macos-debug
          - config: Release
            preset: ci-macos-release
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version || brew install ninja

      # The checkout lives in an iCloud-synchronised folder on the development machine, which
      # occasionally creates "name 2.ext" conflict copies. They are never wanted in the tree.
      - name: Reject iCloud conflict copies
        run: |
          if git ls-files | grep -E ' [0-9]+\.[A-Za-z0-9]+$'; then
            echo "::error::conflict copies are tracked; remove them from the repository"
            exit 1
          fi

      # FetchContent sources dominate the first configure. The cache key follows the files that pin
      # those versions, so a dependency bump re-downloads once instead of on every run.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.config }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.config }}-deps-
            ${{ runner.os }}-deps-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-macos-${{ matrix.config }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

  # Windows has never been built. This job is informational: it must not fail the run while the port
  # is being established. The state it reaches is recorded in docs/WINDOWS_PORT.md.
  windows:
    name: Windows Debug (informational)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: cmake --version

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows

      - name: Test
        run: ctest --preset ci-windows

      - name: Test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-windows
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
